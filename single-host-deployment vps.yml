networks:
  scopesentry-network:
    name: scopesentry-network
    driver: bridge

services:

  scope-sentry:
    image: kamal198/yrtnesepocs:latest
    container_name: scope-sentry
    restart: always
    ports:
      - "8082:8082"
    environment:
      TIMEZONE: Asia/Colombo
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_IP: cluster0.o4vixqz.mongodb.net
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_IP: plot-shop-polite-65450.db.redis.io
      REDIS_PORT: 10009
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8082 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - ./data/files:/opt/ScopeSentry/files
      - ./data/images:/opt/ScopeSentry/images
      - ./data/uploads:/opt/ScopeSentry/uploads
    networks:
      - scopesentry-network

  scopesentry-scan:
    image: kamal198/nacs-yrtnesepocs:latest
    container_name: scopesentry-scan
    restart: always
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      NodeName: node-test
      TimeZoneName: Asia/Colombo
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_IP: cluster0.o4vixqz.mongodb.net
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      REDIS_IP: plot-shop-polite-65450.db.redis.io
      REDIS_PORT: 10009
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      scope-sentry:
        condition: service_healthy
    networks:
      - scopesentry-network
